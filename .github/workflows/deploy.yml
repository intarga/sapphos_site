name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - trunk

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
