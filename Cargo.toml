[package]
name = "sapphos_site"
version = "0.1.0"
edition = "2021"
default-run = "sapphos_site"

[[bin]]
name = "add_user"
test = false
bench = false

[[bin]]
name = "migrate_events"
test = false
bench = false

[dependencies]
anyhow = "1.0.95"
askama = "0.12.1"
askama_web = { version = "0.0.1-pre.0", features = ["axum-0.8"] }
async-trait = "0.1.86"
axum = { version = "0.8", features = ["macros"] }
axum-login = "0.17.0"
chrono = { version = "0.4.39", features = ["serde"] }
chrono-tz = { version = "0.10.0", features = ["serde"] }
deadpool-sqlite = "0.10.0"
itertools = "0.14.0"
password-auth = "1.0.0"
pulldown-cmark = "0.12.2"
reqwest = { version = "0.12.12", features = ["json"] }
rmp-serde = "1.3.0"
rusqlite = { version = "0.33", features = ["chrono"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
thiserror = "2.0.11"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.2", features = ["fs", "compression-full"] }
tower-sessions = { version = "0.14.0", features = ["signed"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
