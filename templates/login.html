<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sappho's Friends</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shrikhand&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Athiti:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- icons -->
    <!-- <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96" /> -->
    <!-- <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" /> -->
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />

    <!-- round icons -->
    <link rel="icon" type="image/png" href="/assets/favicon-round/favicon-96x96.png" sizes="96x96" />

    <link rel="stylesheet" href="/assets/css/form.css?v=1.0">
    <!-- <script type="module" src="/script.mjs?v=1.1"></script> -->
  </head>

  <body>
    <form action="login" method="post" class="login-form">
      <h1>Log in</h1>

      <div class="form-field">
        <label for="username">Username: </label>
        <input type="text" name="username" id="username" required />
      </div>

      <div class="form-field">
        <label for="password">Password: </label>
        <input type="password" name="password" id="password" required />
      </div>

      <div class="form-submit">
        <button type="submit">Post!</button>
      </div>

      {% if let Some(next) = next %}
      <input type="hidden" name="next" value="{{next}}" />
      {% endif %}

    </form>
  </body>
</html>
