<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- icons -->

    <!-- <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg" /> -->
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest" />

    <!-- round icons -->
    <link rel="icon" type="image/png" href="/assets/favicon-round/favicon-96x96.png" sizes="96x96" />

    <link rel="stylesheet" href="/assets/css/form.css?v=1.0">
    <!-- <script type="module" src="/script.mjs?v=1.1"></script> -->
  </head>

  <body>
    <form action="edit_announcement?id={{id}}" method="post" class="announcement-form">
      <h1>Edit an Announcement</h1>
      <div class="form-field">
        <label for="title">Title: </label>
        <input type="text" name="title" id="title" value="{{announcement.title}}" required />
      </div>
      <div class="form-field">
        <label for="body">Body: </label>
        <textarea name="body" id="body" rows="10">{{announcement.body}}</textarea>
      </div>
      <div class="form-field">
        <label for="date">Date: </label>
        <input type="date" name="date" id="date" value="{{announcement.date}}" required />
      </div>
      <div class="form-field">
        <label for="author">Author: </label>
        <input type="text" name="author" id="author" value="{{announcement.author}}" required />
      </div>
      <div class="form-submit">
        <button type="submit">Post!</button>
      </div>
    </form>
  </body>
</html>
