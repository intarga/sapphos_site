<!doctype html>
<html lang="en">
  {{head|safe}}
  <body>
    {{nav|safe}}
    <form action="new_event" method="post" class="event-form">
      <h1>Create an Event</h1>
      <div class="form-field">
        <label for="title">Title: *</label>
        <input type="text" name="title" id="title" required />
      </div>
      <div class="form-field">
        <label for="location">Location: </label>
        <input type="text" name="location" id="location" />
      </div>
      <div class="form-field">
        <label for="description">Description: </label>
        <textarea name="description" id="description" rows="10"></textarea>
      </div>
      <div class="form-field">
        <label for="start_date">Start date: *</label>
        <input type="date" name="start_date" id="start_date" required />
      </div>
      <div class="form-field">
        <label for="end_date">End date: (leave blank for same as start date)</label>
        <input type="date" name="end_date" id="end_date" />
      </div>
      <div class="form-field">
        <label for="start_time">Start time: </label>
        <input type="time" name="start_time" id="start_time" />
      </div>
      <div class="form-field">
        <label for="end_time">End time: </label>
        <input type="time" name="end_time" id="end_time" />
      </div>
      <div class="form-field">
        <label for="host">Host: </label>
        <input type="text" name="host" id="host" />
      </div>
      <div class="form-field">
        <label for="host_email">Host email: </label>
        <input type="text" name="host_email" id="host_email" />
      </div>
      <div class="form-submit">
        <button type="submit">Post!</button>
      </div>
    </form>
  </body>
</html>
